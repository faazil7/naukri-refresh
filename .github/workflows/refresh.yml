name: Naukri Profile Auto-Refresh

on:
  schedule:
    - cron: '30 1-16 * * *' # Runs every 6 hours
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers & System Dependencies
        run: |
          npx playwright install chromium --with-deps || \
          npx playwright-core install chromium --with-deps || \
          node node_modules/playwright/cli.js install chromium --with-deps || \
          node node_modules/playwright-core/cli.js install chromium --with-deps

      - name: Run Profile Refresh
        run: node index.js refresh
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          HEADLESS: 'true'

      - name: Upload Debug Screenshot
        if: always() # Upload even if the test fails
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: profile-debug.png
