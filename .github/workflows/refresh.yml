name: Naukri Gulf Profile Auto-Refresh

on:
  schedule:
    - cron: '0 2-18 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium & System Dependencies
        run: |
          npx npx playwright install --with-deps chromium
        shell: bash

      - name: Run Profile Refresh
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          HEADLESS: 'true'
        run: node index.js refresh
