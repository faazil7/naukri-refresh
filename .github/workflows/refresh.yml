name: Naukri India Profile Auto-Refresh

on:
  schedule:
    - cron: '30 1-16 * * *' # Runs every 6 hours
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xvfb
        run: sudo apt-get install -y xvfb

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers & System Dependencies
        run: |
          npx playwright install-deps chromium
          npx playwright install chromium

      - name: Run Profile Refresh
        run: xvfb-run --auto-servernum npm run refresh
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          HEADLESS: 'false'
          # Force dedicated session for India
          INDIA_SESSION_DIR: './.naukri-session'

      - name: Upload Debug Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: profile-debug.png
